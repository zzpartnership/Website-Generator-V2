# Hard stops. Runs on every push. A red run here is the only thing in this repo that blocks.
name: hard-stops
on:
  push:
  pull_request:
jobs:
  hard-stops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install check dependencies and Chromium
        working-directory: checks
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run hard stops on every project site
        run: |
          status=0
          found=0
          for site in projects/*/site; do
            if [ -f "$site/package.json" ]; then
              found=1
              echo "=================== $site"
              ./checks/all.sh "$site" || status=1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "no project sites yet; checking the starter builds"
            ./checks/all.sh starter || status=1
          fi
          exit $status
