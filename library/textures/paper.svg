<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Paper fibre. Low-frequency turbulence with diffuse lighting. Tile at 600px, blend multiply at 0.3–0.6 over a paper token. -->
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="4" seed="3" stitchTiles="stitch" result="fibre"/>
    <feDiffuseLighting in="fibre" lighting-color="#ffffff" surfaceScale="1.4" diffuseConstant="1.1">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" filter="url(#paper)"/>
</svg>
