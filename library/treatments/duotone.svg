<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!-- Static duotone filter for CSS-only use: filter: url(#duotone-ink-sand). Edit tableValues to the two colours in sRGB 0–1 (shadow first, highlight second). -->
  <filter id="duotone-ink-sand" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.09 0.93"/>
      <feFuncG type="table" tableValues="0.10 0.86"/>
      <feFuncB type="table" tableValues="0.16 0.72"/>
    </feComponentTransfer>
  </filter>
</svg>
